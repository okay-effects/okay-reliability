# okay-reliability on an iPhone, for XcodeGen (spec §26): `scripts/ios.sh` puts the phone's Scala (Scala Native, for
# the simulator and a device) into lib/OkayReliability.xcframework, runs `xcodegen` here and builds. The shell is
# okay-faces' SwiftUI one (a sibling checkout, ../../okay-faces): it draws the program's screens natively and knows no
# application. No entitlements: installed with a free Apple ID (SideStore), which allows none of the paid ones
name: OkayReliability
options:
  bundleIdPrefix: io.github.okay-effects
  deploymentTarget:
    iOS: "17.0"
packages:
  OkayFaces:
    path: ../../okay-faces
targets:
  OkayReliability:
    type: application
    platform: iOS
    sources: [Reliability]
    info:
      path: Reliability/Info.plist
      properties:
        {}
    dependencies:
      - package: OkayFaces
      - framework: lib/OkayReliability.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.okay-effects.reliability
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: okay-reliability
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS: [-lc++]
        # ad hoc here (the simulator's keychain answers a signed app only); SideStore signs it with your Apple ID
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
  OkayReliabilityUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ReliabilityUITests]
    dependencies:
      - target: OkayReliability
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.okay-effects.reliability.uitests
        GENERATE_INFOPLIST_FILE: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_VERSION: "5.0"
schemes:
  OkayReliability:
    build:
      targets:
        OkayReliability: all
    test:
      targets: [OkayReliabilityUITests]
